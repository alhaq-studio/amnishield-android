name: AmniShield Unified CI/CD Pipeline

on:
  push:
    branches: [ main, Test/Pre-Production ]
  pull_request:
    branches: [ main, Test/Pre-Production ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # =========================================================================
  # Target 1: Android Client CI (PlayStore, F-Droid, Universal)
  # =========================================================================
  android-ci:
    name: Android Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests (PlayStore Flavor)
        run: ./gradlew testPlaystoreDebugUnitTest

      - name: Run Unit Tests (F-Droid FOSS Flavor)
        run: ./gradlew testFdroidDebugUnitTest

      - name: Run Unit Tests (Universal Flavor)
        run: ./gradlew testUniversalDebugUnitTest

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/

      - name: Assemble Debug Artifacts (Compile Verification)
        run: ./gradlew assemblePlaystoreDebug assembleFdroidDebug assembleUniversalDebug

      - name: Upload PlayStore Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmniShield-Playstore-Debug
          path: app/build/outputs/apk/playstore/debug/app-playstore-debug.apk

      - name: Upload F-Droid Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmniShield-Fdroid-Debug
          path: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk

      - name: Upload Universal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmniShield-Universal-Debug
          path: app/build/outputs/apk/universal/debug/app-universal-debug.apk

  # =========================================================================
  # Target 2: Supabase Backend CI (Deno Edge Functions & DB Migrations)
  # =========================================================================
  backend-ci:
    name: Supabase Backend & Edge Functions CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Deno Runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Run Deno Edge Function Unit Tests
        run: |
          deno test --allow-net --allow-env supabase/functions/community-access/index_test.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase Database Migrations
        run: |
          supabase start
          supabase db lint
          supabase test db

  # =========================================================================
  # Target 3: Security & Compliance Audit
  # =========================================================================
  security-audit:
    name: Zero-Knowledge & Security Compliance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify F-Droid FOSS Isolation
        run: |
          echo "[INFO] Verifying F-Droid flavor does not include proprietary GMS libraries..."
          if grep -rn "play-services-base" app/src/fdroid; then
            echo "[ERROR] Proprietary GMS library found in F-Droid source tree!"
            exit 1
          fi
          echo "[SUCCESS] F-Droid FOSS tree clean."

      - name: Verify Public Key Ring Integrity
        run: |
          echo "[INFO] Verifying ECDSA Public Key is present in LicenseValidator..."
          grep -q "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE7EFR1qxpfZTMeR52M1+04+tPb6ItmVmhPbRCIJYje3jtglTdBbcct+/xvc1D1NZtXuvSb4Egtdqm/EJ6H67fEA==" app/src/main/java/com/alhaq/amnishield/premium/LicenseValidator.kt
          echo "[SUCCESS] License keyring integrity verified."

  # =========================================================================
  # Target 4: Pipeline Gate (All targets must succeed)
  # =========================================================================
  pipeline-gate:
    name: CI/CD Ecosystem Gatekeeper
    runs-on: ubuntu-latest
    needs: [android-ci, backend-ci, security-audit]
    steps:
      - name: Confirm Pipeline Success
        run: |
          echo "[SUCCESS] All Android, Supabase Backend, and Security targets passed."
