name: AmniShield Unified CI/CD Pipeline

on:
  push:
    branches: [ main, Test/Pre-Production ]
  pull_request:
    branches: [ main, Test/Pre-Production ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # =========================================================================
  # Target 1: Android Client CI Matrix (PlayStore, F-Droid, Universal)
  # =========================================================================
  android-ci:
    name: Android Test & Build (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [playstore, fdroid, universal]
        include:
          - flavor: playstore
            taskPrefix: Playstore
            artifactName: AmniShield-Playstore-Debug
            apkPath: app/build/outputs/apk/playstore/debug/app-playstore-debug.apk
          - flavor: fdroid
            taskPrefix: Fdroid
            artifactName: AmniShield-Fdroid-Debug
            apkPath: app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          - flavor: universal
            taskPrefix: Universal
            artifactName: AmniShield-Universal-Debug
            apkPath: app/build/outputs/apk/universal/debug/app-universal-debug.apk
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests (${{ matrix.flavor }})
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew test${{ matrix.taskPrefix }}DebugUnitTest --stacktrace 2>&1 | tee gradle-${{ matrix.flavor }}.log || {
            echo "### Gradle ${{ matrix.taskPrefix }} Test Failure" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 gradle-${{ matrix.flavor }}.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Test Reports (${{ matrix.flavor }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ matrix.flavor }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            *.log
          if-no-files-found: ignore

      - name: Assemble Debug APK (${{ matrix.flavor }})
        run: |
          ./gradlew assemble${{ matrix.taskPrefix }}Debug --stacktrace

      - name: Upload Debug APK (${{ matrix.flavor }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.apkPath }}

  # =========================================================================
  # Target 2: Supabase Backend CI (Deno Edge Functions & DB Migrations)
  # =========================================================================
  backend-ci:
    name: Supabase Backend & Edge Functions CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Deno Runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno Edge Function Unit Tests
        run: |
          deno test --allow-net --allow-env supabase/functions/community-access/index_test.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase Database Migrations
        continue-on-error: true
        run: |
          supabase start || echo "[WARN] Local Supabase stack unavailable in runner environment"
          if supabase status > /dev/null 2>&1; then
            supabase db lint
            supabase test db
          fi

  # =========================================================================
  # Target 3: Security & Compliance Audit
  # =========================================================================
  security-audit:
    name: Zero-Knowledge & Security Compliance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify F-Droid FOSS Isolation
        run: |
          echo "[INFO] Verifying F-Droid flavor does not include proprietary GMS libraries..."
          if grep -rn "play-services-base" app/src/fdroid; then
            echo "[ERROR] Proprietary GMS library found in F-Droid source tree!"
            exit 1
          fi
          echo "[SUCCESS] F-Droid FOSS tree clean."

      - name: Verify Public Key Ring Integrity
        run: |
          echo "[INFO] Verifying ECDSA Public Key is present in LicenseValidator..."
          grep -q "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE7EFR1qxpfZTMeR52M1+04+tPb6ItmVmhPbRCIJYje3jtglTdBbcct+/xvc1D1NZtXuvSb4Egtdqm/EJ6H67fEA==" app/src/main/java/com/alhaq/amnishield/premium/LicenseValidator.kt
          echo "[SUCCESS] License keyring integrity verified."

  # =========================================================================
  # Target 4: Pipeline Gate (All targets must succeed)
  # =========================================================================
  pipeline-gate:
    name: CI/CD Ecosystem Gatekeeper
    runs-on: ubuntu-latest
    needs: [android-ci, backend-ci, security-audit]
    steps:
      - name: Confirm Pipeline Success
        run: |
          echo "[SUCCESS] All Android, Supabase Backend, and Security targets passed."
