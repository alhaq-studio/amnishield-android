name: Release

# Triggers when you push a version tag: git tag v1.2.3 && git push origin v1.2.3
# Pre-release tags (-alpha, -beta, -rc) are auto-flagged as pre-release on GitHub.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to release (e.g. v0.4.0)'
        required: false
        default: 'v0.4.0'

permissions:
  contents: write

jobs:
  # ── Job 1: Unit Tests ──────────────────────────────────────────────────────
  # The release WILL NOT proceed if any test fails.
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests (all flavors)
        run: |
          chmod +x ./gradlew
          ./gradlew testPlaystoreDebugUnitTest --stacktrace
          ./gradlew testFdroidDebugUnitTest --stacktrace
          ./gradlew testUniversalDebugUnitTest --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # ── Job 2: Build & Publish Universal Release ──────────────────────────────
  # Only runs automatically after Job 1 (tests) passes.
  # Publishes ONLY the universal signed APK to GitHub Releases.
  # Play Store (.aab/.apk) goes via Play Console; F-Droid builds from source.
  release:
    name: Build & Publish Universal Release APK
    runs-on: ubuntu-latest
    needs: test   # Hard gate: this job is cancelled if tests fail

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Signing keystore ────────────────────────────────────────────────────
      - name: Configure Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF
            echo "[OK] Release signing keystore configured."
          else
            echo "[INFO] KEYSTORE_BASE64 secret not set; building unsigned release APK."
          fi

      # ── Build Universal release APK ─────────────────────────────────────────
      - name: Build Universal Release APK
        run: ./gradlew lintVitalUniversalRelease assembleUniversalRelease --stacktrace

      # ── Rename APK with version tag ─────────────────────────────────────────
      - name: Rename Universal APK
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if [ -f "app/build/outputs/apk/universal/release/app-universal-release.apk" ]; then
            cp app/build/outputs/apk/universal/release/app-universal-release.apk AmniShield-${TAG}-universal.apk
          elif [ -f "app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk AmniShield-${TAG}-universal.apk
          else
            echo "[ERROR] Universal release APK not found!" && exit 1
          fi

      # ── Publish to GitHub Releases ──────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "AmniShield ${{ inputs.tag_name || github.ref_name }}"
          body: |
            ## AmniShield ${{ inputs.tag_name || github.ref_name }}

            > [PASSED] All unit tests and release lint checks passed before this release was published.

            ### Download

            | APK | Who should use this? |
            |-----|----------------------|
            | `AmniShield-${{ inputs.tag_name || github.ref_name }}-universal.apk` | Standard Android sideload release |

            ### Installing
            1. Download `AmniShield-${{ inputs.tag_name || github.ref_name }}-universal.apk` above.
            2. Enable **Install from unknown sources** in your Android settings.
            3. Open the downloaded APK to install.

            ### Notes
            - Only the **Universal** APK is distributed on GitHub Releases.
            - The **Play Store** flavor is distributed via Google Play Console, and the **F-Droid** flavor is built from source for F-Droid.
            - See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ inputs.tag_name || github.ref_name }}/CHANGELOG.md) and [README.md](https://github.com/${{ github.repository }}/blob/${{ inputs.tag_name || github.ref_name }}/README.md) for details.
          files: |
            AmniShield-${{ inputs.tag_name || github.ref_name }}-universal.apk
          draft: false
          prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-beta') || contains(inputs.tag_name || github.ref_name, '-rc') || contains(inputs.tag_name || github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

